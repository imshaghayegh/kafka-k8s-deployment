apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-metrics-fluent-bit
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-metrics-fluent-bit
  template:
    metadata:
      labels:
        app: kafka-metrics-fluent-bit
    spec:
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:4.2.0
          args:
            - -c
            - /fluent-bit/etc/fluent-bit.conf
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kafka-fluent-bit-config
