apiVersion: v1
kind: Pod
metadata:
  name: kafka-client
  namespace: kafka
spec:
  restartPolicy: Always
  containers:
    - name: kafka-client
      image: apache/kafka:4.3.1
      command: ["/bin/sh", "-c"]
      args: ["sleep 360000"]
      volumeMounts:
        - name: user-certs
          mountPath: /etc/kafka/user
          readOnly: true
        - name: cluster-ca
          mountPath: /etc/kafka/ca
          readOnly: true
  volumes:
    - name: user-certs
      secret:
        secretName: orders-app
    - name: cluster-ca
      secret:
        secretName: prod-kafka-cluster-ca-cert
