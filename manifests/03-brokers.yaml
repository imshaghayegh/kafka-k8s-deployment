apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: brokers
  namespace: kafka
  labels:
    strimzi.io/cluster: prod-kafka
spec:
  replicas: 3
  roles:
    - broker
  resources:
    requests:
      cpu: '2'
      memory: 4Gi
    limits:
      memory: 6Gi
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 100Gi
        class: kafka-local
        deleteClaim: false
        kraftMetadata: shared
  template:
    pod:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: strimzi.io/cluster
                    operator: In
                    values: [prod-kafka]
                  - key: strimzi.io/pool-name
                    operator: In
                    values: [brokers]
              topologyKey: kubernetes.io/hostname
