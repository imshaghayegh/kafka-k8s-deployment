apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-fluent-bit-config
  namespace: kafka
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush        5
        Log_Level    info

    [INPUT]
        Name             prometheus_scrape
        Tag              kafka.metrics
        Host             kafka-exporter-metrics.kafka.svc.cluster.local
        Port             9404
        Metrics_Path     /metrics
        Scrape_Interval  30s

    [OUTPUT]
        Name              prometheus_remote_write
        Match             kafka.metrics
        Host              <Mimir-Host>
        Port              <Mimir-Port>
        Uri               /api/v1/push
        Header            X-Scope-OrgID kafka-monitoring
        Add_Label         cluster prod-kafka
        Add_Label         environment production
        Retry_Limit       False
